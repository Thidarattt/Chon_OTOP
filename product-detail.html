  const categoryNames = { food: 'อาหาร', drink: 'เครื่องดื่ม', cloth: 'ผ้าและเครื่องแต่งกาย', decor: 'ของใช้/ของตกแต่ง', herb: 'สมุนไพรที่ไม่ใช่อาหาร' };

  document.addEventListener('DOMContentLoaded', () => {
      // 1. ดึง id จาก URL (เช่น product-detail.html?id=1)
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get('id')) || 1; // ถ้าไม่มี id ส่งมา ให้ใช้ id 1 เป็นค่าเริ่มต้น

      // 2. ค้นหาสินค้าที่ตรงกับ id
      const product = otopProducts.find(p => p.id === productId);
      const container = document.getElementById('productDetailContent');

      if (!product) {
          container.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">ไม่พบข้อมูลสินค้า</p>`;
          return;
      }

      // 3. แสดงผลข้อมูลลงในหน้าจอ
      container.innerHTML = `
          <div class="detail-img-box">
              <img src="${product.img}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/500'">
          </div>
          <div class="detail-info">
              <span class="badge">${categoryNames[product.category] || 'OTOP'}</span>
              <h1 class="title">${product.name}</h1>
              <div class="seller"><i class="fa-solid fa-store"></i> ${product.seller}</div>
              <p class="desc">${product.description ? product.description : 'รายละเอียดราคาสินค้าตามตาราง OTOP ชลบุรี'}</p>
              
              <div class="info-list">
                  <div class="info-item"><i class="fa-solid fa-location-dot"></i> <strong>อำเภอ:</strong> อ.${product.district} จ.ชลบุรี</div>
                  <div class="info-item"><i class="fa-solid fa-phone"></i> <strong>เบอร์โทรศัพท์:</strong> ${product.phone}</div>
                  ${product.facebook ? `<div class="info-item"><i class="fa-brands fa-facebook"></i> <strong>Facebook:</strong> ${product.facebook}</div>` : ''}
              </div>

              <a href="tel:${product.phone}" class="btn-contact"><i class="fa-solid fa-phone-volume"></i> โทรติดต่อผู้ประกอบการ (${product.phone})</a>
          </div>
      `;
  });
  </script>
